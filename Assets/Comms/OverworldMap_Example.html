<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuildSim Overworld - concept v3 (discovery + tide)</title>
<style>
  :root{ --bg1:#1a0b3d; --bg2:#3b0f6b; --bg3:#0d2a5c; --ink:#fff7e6; --dim:#b9a7e6; --gold:#ffd23f; --pink:#ff4fa3; --mint:#3dffc2; --sky:#47c8ff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#12072b;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
  #bg{position:fixed;inset:0;background:
      radial-gradient(1200px 800px at 20% 20%, var(--bg2), transparent 60%),
      radial-gradient(1000px 700px at 85% 80%, var(--bg3), transparent 60%),
      linear-gradient(135deg,var(--bg1),#2a0a52);animation:hue 24s linear infinite}
  @keyframes hue{0%{filter:hue-rotate(0)}50%{filter:hue-rotate(40deg)}100%{filter:hue-rotate(0)}}
  canvas{position:fixed;inset:0;pointer-events:none;z-index:4}
  svg#map{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
  svg#map.drag{cursor:grabbing}

  .hud{position:fixed;z-index:5;font-weight:800;letter-spacing:.3px}
  #title{left:22px;top:16px;font-size:26px;text-shadow:0 3px 0 #0006,0 0 24px #ff4fa388}
  #title small{display:block;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:2px;text-transform:uppercase}
  #stats{right:22px;top:16px;display:flex;gap:10px}
  .pill{background:linear-gradient(#ffffff22,#ffffff0a);border:2px solid #ffffff33;border-radius:999px;padding:8px 16px;
    backdrop-filter:blur(6px);box-shadow:0 6px 0 #0004, inset 0 2px 0 #fff3;font-size:18px;white-space:nowrap}
  .pill b{color:var(--gold)}
  #tide{left:50%;top:14px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 18px 8px 12px}
  #moonIcon{font-size:30px;filter:drop-shadow(0 0 10px #fff8);transition:transform .3s}
  #moonIcon.bump{transform:scale(1.5) rotate(-20deg)}
  #tideBar{width:230px;height:16px;border-radius:99px;background:#0006;overflow:hidden;box-shadow:inset 0 2px 4px #0008;position:relative}
  #tideFill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#47c8ff,#3dffc2,#ffd23f);transition:width .5s cubic-bezier(.3,1.5,.5,1);box-shadow:0 0 14px #47c8ffaa;position:relative;overflow:hidden}
  #tideFill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(110deg,transparent 0 14px,#ffffff30 14px 22px);animation:slide 1s linear infinite}
  @keyframes slide{to{background-position:44px 0}}
  #tideLabel{font-size:13px;color:var(--dim);min-width:92px}
  #tide.danger{animation:throb .6s ease-in-out infinite}
  @keyframes throb{50%{transform:translateX(-50%) scale(1.07);box-shadow:0 0 30px #47c8ff}}

  #buttons{left:22px;bottom:20px;display:flex;gap:10px}
  button{font:inherit;font-weight:800;color:#2a0a40;border:0;border-radius:14px;padding:11px 18px;cursor:pointer;
    background:linear-gradient(#ffe57a,#ffb52e);box-shadow:0 5px 0 #b86a00,0 10px 24px #0006;transition:transform .08s, filter .15s}
  button:hover{transform:translateY(-2px) scale(1.04);filter:brightness(1.08)}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #b86a00}
  button.alt{background:linear-gradient(#9fe7ff,#3fa9ff);box-shadow:0 5px 0 #1a5fa8,0 10px 24px #0006}
  #panel{right:22px;bottom:20px;width:310px;padding:16px 18px;border-radius:22px;background:linear-gradient(#ffffff26,#ffffff0d);
    border:2px solid #ffffff3a;backdrop-filter:blur(10px);box-shadow:0 10px 0 #0003,0 20px 50px #0007, inset 0 2px 0 #fff4;
    transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
  #panel.hide{transform:translateY(160%)}
  #panel h2{margin:0 0 2px;font-size:22px}
  #panel .sub{color:var(--dim);font-size:13px;margin-bottom:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  #panel .row{display:flex;justify-content:space-between;font-size:15px;padding:3px 0}
  #panel .row span:last-child{font-weight:800;color:var(--mint)}
  #panel button{width:100%;margin-top:12px}
  #hint{left:50%;bottom:22px;transform:translateX(-50%);color:var(--dim);font-size:13px;font-weight:700;opacity:.8}
  #toast{position:fixed;left:50%;top:92px;transform:translate(-50%,-20px) scale(.8);opacity:0;z-index:9;font-size:30px;font-weight:900;color:var(--gold);
    text-shadow:0 4px 0 #7a3b00,0 0 30px #ffd23f;pointer-events:none;transition:all .35s cubic-bezier(.3,1.7,.5,1);text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

  #modal{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:#0a0420aa;backdrop-filter:blur(6px)}
  #modal.show{display:flex}
  #modalBox{text-align:center;animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
  #modalBox h1{margin:0;font-size:34px;text-shadow:0 4px 0 #0006,0 0 30px #ff4fa3}
  #modalBox p{margin:6px 0 22px;color:var(--dim);font-weight:700}
  .cards{display:flex;gap:18px;justify-content:center}
  .card{width:200px;padding:20px 16px;border-radius:22px;cursor:pointer;background:linear-gradient(#ffffff2e,#ffffff10);border:2px solid #ffffff44;
    box-shadow:0 10px 0 #0004,0 24px 50px #0008, inset 0 2px 0 #fff4;transition:transform .15s cubic-bezier(.3,1.8,.5,1), box-shadow .15s;animation:pop .5s cubic-bezier(.3,1.7,.5,1) backwards}
  .card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
  .card:hover{transform:translateY(-10px) scale(1.06);box-shadow:0 18px 0 #0004,0 34px 70px #000a,0 0 40px var(--c)}
  .card .ic{font-size:54px;filter:drop-shadow(0 6px 0 #0005)}
  .card h3{margin:8px 0 4px;font-size:20px;color:var(--c)}
  .card small{color:var(--dim);font-size:13px;font-weight:700;display:block;min-height:54px}
  .card .cost{display:inline-block;margin-top:6px;font-size:13px;font-weight:900;padding:3px 10px;border-radius:99px;background:#0005}
  @keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}

  #banner{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;text-align:center}
  #banner.show{display:flex}
  #banner h1{font-size:60px;margin:0;color:#fff;text-shadow:0 6px 0 #1a5fa8,0 0 50px #47c8ff;animation:pop .7s cubic-bezier(.3,1.8,.5,1)}
  #banner p{font-size:26px;font-weight:900;margin:8px 0;color:var(--gold);text-shadow:0 3px 0 #7a3b00;animation:pop .7s .2s cubic-bezier(.3,1.8,.5,1) backwards}

  .edge{fill:none;stroke-linecap:round}
  .edge.open{stroke-width:6;stroke-dasharray:14 12;animation:flow 1.1s linear infinite;filter:drop-shadow(0 0 8px currentColor)}
  .edge.done{stroke-width:7;filter:drop-shadow(0 0 10px currentColor)}
  @keyframes flow{to{stroke-dashoffset:-52}}
  .node{cursor:pointer}
  .node:hover .body{transform:scale(1.12)}
  .body{transform-box:fill-box;transform-origin:center;transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
  .bob{animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .pulse{animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}
  .appear{animation:appear .7s cubic-bezier(.3,1.9,.5,1) backwards;transform-box:fill-box;transform-origin:center}
  @keyframes appear{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  .washed{transition:opacity .5s, transform .6s cubic-bezier(.6,0,1,.6);opacity:0;transform:translateY(60px) scale(.3) !important}
  .label{font-weight:900;text-anchor:middle;paint-order:stroke;stroke:#12072b;stroke-width:5px;stroke-linejoin:round;pointer-events:none}
  .shake{animation:shake .5s}
  @keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-9px,4px)}40%{transform:translate(8px,-5px)}60%{transform:translate(-5px,-4px)}80%{transform:translate(4px,5px)}}
  /* --- the tide is a force of nature: colours drain as the moon fills --- */
  :root{--dread:0}
  #bg{animation:none;filter:saturate(calc(1 - var(--dread)*.6)) brightness(calc(1 - var(--dread)*.42))}
  svg#map{filter:saturate(calc(1 - var(--dread)*.4)) brightness(calc(1 - var(--dread)*.18))}
  #tideFill{background:linear-gradient(90deg,#2a7fb0,#1f8fa0,#9fd8e0);box-shadow:0 0 14px #1d6fa8aa}
  #tide.danger{animation:omen 2.6s ease-in-out infinite}
  @keyframes omen{50%{transform:translateX(-50%) scale(1.03);box-shadow:0 0 34px #1d6fa8,0 0 70px #0a2a4a}}
  #toast.dark{color:#cfe8f5;text-shadow:0 3px 0 #04121f,0 0 24px #1d6fa8;font-size:26px}
  #banner h1{font-family:Georgia,"Times New Roman",serif;font-size:44px;letter-spacing:7px;font-weight:700;color:#e6f2f8;text-shadow:0 4px 0 #04121f,0 0 40px #1d6fa8;animation:fadein 2.2s ease-out}
  #banner p{font-family:Georgia,serif;color:#a9d3e6;font-size:20px;text-shadow:0 2px 0 #04121f;animation:fadein 2.6s .5s ease-out backwards}
  @keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  svg#map.tremor{animation:tremor .09s linear infinite}
  @keyframes tremor{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px)}}
  .swallowed{transition:opacity 1.4s ease-in, transform 1.6s cubic-bezier(.5,0,1,.7), filter 1s;opacity:0;filter:brightness(.25) saturate(.3);transform:translateY(70px) rotate(14deg) scale(.55) !important}
  .wet{filter:saturate(.35) brightness(.7);opacity:.82;transition:filter 1.2s,opacity 1.2s}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="fx"></canvas>
<svg id="map"><defs id="defs"></defs><g id="world"><g id="decor"></g><g id="edges"></g><g id="nodes"></g></g></svg>

<div class="hud" id="title">BUILDSIM<small>Overworld - concept v3</small></div>
<div class="hud pill" id="tide"><span id="moonIcon">&#127761;</span><div><div id="tideBar"><div id="tideFill"></div></div></div><span id="tideLabel">Flood in 10</span></div>
<div class="hud" id="stats">
  <div class="pill">Lands <b id="sMaps">1</b></div>
  <div class="pill">Reach <b id="sTier">0</b></div>
  <div class="pill">Pearls <b id="sPearls">0</b></div>
</div>
<div class="hud" id="buttons">
  <button id="bNew">New world</button>
  <button class="alt" id="bFlood">Turn the tide (test)</button>
</div>
<div class="hud" id="hint">drag to pan - wheel to zoom - the sea is rising from below - build downward from the high ground</div>
<div class="hud hide" id="panel"></div>
<div id="toast"></div>
<div id="modal"><div id="modalBox"><h1>New land discovered!</h1><p id="modalSub"></p><div class="cards" id="cards"></div></div></div>
<div id="banner"><h1 id="bTitle"></h1><p id="bSub"></p><p id="bPearls"></p></div>

<script>
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs={}, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- map net generation (planar, natural) ----------
   Only the LAYOUT exists up front (where lands lie and which are neighbours). Nothing about a land is decided
   until the player discovers it: its seed and its modifier are created at that moment. */
const MAP_COUNT = 34;
const NAMES = ["Mossy Hollow","Pebble Bay","Whisper Pines","Amber Ridge","Lantern Glade","Frost Hollow","Sunken Quarry","Copper Dunes","Willow Reach","Ember Flats","Starfall Moor","Ivory Cliffs","Bramble Vale","Opal Shore","Thistle Run","Cinder Peak","Marigold Fen","Hushed Grove","Driftwood Isle","Quartz Basin","Fable Meadow","Rustling Wood","Kettle Hill","Glimmer Pond","Wren's Rest","Tumble Stones","Honey Hollow","Saffron Steppe","Nimbus Ledge","Echo Canyon","Plum Orchard","Tidepool Ring","Gilded Marsh","Owl's Perch","Dapple Dell","Moonlit Weir","Fern Terrace","Clover Crown","Hearth Hills","Silt Crossing"];
function sizeForTier(t){ return {w:Math.min(28+8*t,120), h:Math.min(20+6*t,90)}; }

function generate(seed){
  const rng = mulberry32(seed);
  const names=[...NAMES].sort(()=>rng()-.5);
  // The start is HIGH GROUND at the top (0,0). Every other land lies below it, toward the sea, and the
  // world widens as it goes down. y grows downward = toward the water.
  const Y0=170, Y1=900;
  const halfW=y=>300+((y-Y0)/(Y1-Y0))*420;
  const pts=[{x:0,y:0}];
  let minD=165;
  while(pts.length<MAP_COUNT){
    for(let tries=0; tries<500 && pts.length<MAP_COUNT; tries++){
      const y=Y0+Math.pow(rng(),0.9)*(Y1-Y0), x=(rng()*2-1)*halfW(y);
      const p={x,y};
      if(pts.every(q=>Math.hypot(p.x-q.x,p.y-q.y)>=minD)) pts.push(p);
    }
    minD*=0.94;
  }
  const nodes=pts.map((p,i)=>({id:i,x:p.x,y:p.y,tier:0,name:names[i%names.length],status:'hidden',mod:null,seed:0}));
  const d=(a,b)=>Math.hypot(nodes[a].x-nodes[b].x,nodes[a].y-nodes[b].y);
  const gab=[];
  for(let a=0;a<nodes.length;a++) for(let b=a+1;b<nodes.length;b++){
    const mx=(nodes[a].x+nodes[b].x)/2, my=(nodes[a].y+nodes[b].y)/2, rad=d(a,b)/2;
    let ok=true;
    for(let k=0;k<nodes.length&&ok;k++){ if(k===a||k===b) continue; if(Math.hypot(nodes[k].x-mx,nodes[k].y-my) < rad*0.999) ok=false; }
    if(ok) gab.push({a,b,len:d(a,b)});
  }
  gab.sort((p,q)=>p.len-q.len);
  const parent=nodes.map((_,i)=>i); const find=x=>parent[x]===x?x:(parent[x]=find(parent[x]));
  const edges=[], deg=nodes.map(()=>0), used=new Set();
  const key=(a,b)=>a<b?a+'-'+b:b+'-'+a;
  const add=(e,kind)=>{ edges.push({a:e.a,b:e.b,kind}); deg[e.a]++; deg[e.b]++; used.add(key(e.a,e.b)); };
  gab.forEach(e=>{ const ra=find(e.a), rb=find(e.b); if(ra!==rb){ parent[ra]=rb; add(e,'tree'); } });
  const nearest=nodes.map((_,i)=>Math.min(...nodes.map((_,j)=>j===i?Infinity:d(i,j))));
  gab.forEach(e=>{
    if(used.has(key(e.a,e.b))) return;
    if(deg[e.a]>=3||deg[e.b]>=3) return;
    if(e.len > 1.55*Math.max(nearest[e.a],nearest[e.b])) return;
    if(rng()<0.6) add(e,'loop');
  });
  const adj=nodes.map(()=>[]); edges.forEach(e=>{adj[e.a].push(e.b);adj[e.b].push(e.a);});
  const q=[0], seen=new Set([0]);
  while(q.length){ const c=q.shift(); adj[c].forEach(n=>{ if(!seen.has(n)){ seen.add(n); nodes[n].tier=nodes[c].tier+1; q.push(n);} }); }
  // permanent settlement sites ABOVE the start: the tide never reaches them
  const slots=[{x:-215,y:-95},{x:0,y:-165},{x:215,y:-95}];
  const maxY=Math.max(...nodes.map(n=>n.y));
  return {nodes, edges, seed, slots, sea0:maxY+190};
}

/* high ground, settlement sites and the high-water mark */
function drawDecor(){
  decorG.innerHTML='';
  const gd=el('linearGradient',{id:'plat',x1:0,y1:0,x2:0,y2:1},defs);
  el('stop',{offset:0,'stop-color':'#7a69bd'},gd); el('stop',{offset:1,'stop-color':'#2a2252'},gd);
  const shape='M-480 130 C-450 40 -390 -30 -310 -85 C-240 -135 -175 -220 -95 -245 L95 -245 C175 -220 240 -135 310 -85 C390 -30 450 40 480 130 Z';
  el('path',{d:shape,fill:'url(#plat)',stroke:'#a99bea','stroke-width':3,opacity:.92},decorG);
  el('path',{d:'M-300 -90 C-235 -138 -172 -222 -92 -246 L92 -246 C172 -222 235 -138 300 -90',fill:'none',stroke:'#e2d9ff','stroke-width':4,opacity:.55,'stroke-linecap':'round'},decorG);
  const t=el('text',{x:0,y:-212,class:'label','font-size':14,fill:'#cfc3ff','letter-spacing':5,'stroke-width':4},decorG); t.textContent='HIGH GROUND';
  state.slots.forEach(s=>{
    el('path',{d:`M0 0 L${s.x} ${s.y}`,stroke:'#cfc3ff','stroke-width':3,'stroke-dasharray':'3 9','stroke-linecap':'round',opacity:.5},decorG);
    const g=el('g',{transform:`translate(${s.x} ${s.y})`,opacity:.8},decorG);
    el('polygon',{points:'0,-26 23,-13 23,13 0,26 -23,13 -23,-13',fill:'#1d1745',stroke:'#cfc3ff','stroke-width':2.5,'stroke-dasharray':'5 5'},g);
    const h=el('text',{y:9,class:'label','font-size':24,fill:'#cfc3ff','stroke-width':3},g); h.textContent='⌂';
    const l=el('text',{y:44,class:'label','font-size':11,fill:'#a99bea','stroke-width':3},g); l.textContent='settlement site';
  });
  // the tide never rises above this line
  el('path',{d:`M-560 ${FRONT_TOP+36} L560 ${FRONT_TOP+36}`,stroke:'#47c8ff','stroke-width':2,'stroke-dasharray':'10 10',opacity:.4},decorG);
  const m=el('text',{x:-548,y:FRONT_TOP+28,class:'label','font-size':12,fill:'#7fd0ea','stroke-width':3,style:'text-anchor:start'},decorG); m.textContent='high-water mark';
}

/* ---------- modifiers (offered as a choice when a land is discovered) ---------- */
const MODS = [
  {id:'veins',  icon:'⛏️', name:'Rich Veins',   c:'#9fd2ff', desc:'Many stone deposits. Fewer trees.',            moon:1},
  {id:'woods',  icon:'🌲', name:'Deep Woods',   c:'#7dff9a', desc:'Dense forests. Little stone.',                 moon:1},
  {id:'lakes',  icon:'🌊', name:'Many Lakes',   c:'#47c8ff', desc:'Lots of water. Less room to build.',           moon:1},
  {id:'dunes',  icon:'🏜️', name:'Shifting Dunes', c:'#ffd27a', desc:'Open land, few resources.',              moon:1},
  {id:'blessing',icon:'🌙',name:'Moon Blessing',c:'#d9b8ff', desc:'The tide is held back: +2 moons of time.',     moon:-2},
  {id:'storm',  icon:'⚡',       name:'Storm Coast',  c:'#ffe94a', desc:'Rich rewards - but the tide rises faster.',     moon:2},
  {id:'ruins',  icon:'🏛️', name:'Old Ruins', c:'#ff9fd0', desc:'Start with a free building. Pearls on flood.',  moon:1},
  {id:'calm',   icon:'🌿', name:'Gentle Hills', c:'#c6ff8a', desc:'Balanced land. A safe choice.',                moon:1},
];

/* ---------- state ---------- */
const MOON_MAX = 10;
const MOON_ICONS = ["🌑","🌒","🌓","🌔","🌕"];
let state, pearls=0, best=0, rngLive=Math.random, flooding=false;
function neighbors(id){ return state.edges.filter(e=>e.a===id||e.b===id).map(e=>e.a===id?e.b:e.a); }
function revealAround(id){ const out=[]; neighbors(id).forEach(i=>{ const m=state.nodes[i]; if(m.status==='hidden'){ m.status='open'; out.push(i);} }); return out; }
function discoveredCount(){ return state.nodes.filter(n=>n.status==='done').length; }
function reach(){ return Math.max(0,...state.nodes.filter(n=>n.status==='done').map(n=>n.tier)); }
function stats(){ $('#sMaps').textContent=discoveredCount(); $('#sTier').textContent=reach(); $('#sPearls').textContent=pearls; }
function tideUI(bump){
  const m=Math.min(state.moon,MOON_MAX); const p=m/MOON_MAX;
  $('#tideFill').style.width=(p*100)+'%';
  $('#moonIcon').textContent=MOON_ICONS[Math.min(4,Math.floor(p*5))];
  $('#tideLabel').textContent = m>=MOON_MAX ? 'The sea rises' : (MOON_MAX-m<=2 ? 'The sea stirs... '+(MOON_MAX-m) : 'Tide in '+(MOON_MAX-m));
  if(!flooding){ riseTarget=p*p*0.17*state.sea0; setDread(p*0.85); }
  $('#tide').classList.toggle('danger', MOON_MAX-m<=2);
  if(bump){ const i=$('#moonIcon'); i.classList.add('bump'); setTimeout(()=>i.classList.remove('bump'),350); }
}

/* ---------- drawing ---------- */
const world=$('#world'), edgesG=$('#edges'), nodesG=$('#nodes'), defs=$('#defs'), decorG=$('#decor');
let view={x:0,y:0,k:1}; let selected=null; const nodeEls={};
const hueOf = t => (330 + t*38) % 360;
function fitView(){
  // high ground at the top, the sea at the bottom: frame both
  const xs=state.nodes.map(n=>n.x), minY=-290, maxY=state.sea0+130;
  const w=Math.max(...xs.map(Math.abs))*2+340, h=maxY-minY;
  view.k=Math.min(innerWidth/w, (innerHeight-60)/h, 1.4);
  view.x=innerWidth/2;
  view.y=(innerHeight+40)/2-(minY+maxY)/2*view.k;
  applyView();
}
function applyView(){ world.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`); }
const worldToScreen=(x,y)=>({x:x*view.k+view.x,y:y*view.k+view.y});

function render(fresh=[]){
  edgesG.innerHTML=''; nodesG.innerHTML=''; defs.innerHTML=''; for(const k in nodeEls) delete nodeEls[k];
  drawDecor();
  state.nodes.forEach(n=>{
    const h=hueOf(n.tier);
    const g=el('radialGradient',{id:'g'+n.id,cx:'35%',cy:'30%',r:'80%'},defs);
    el('stop',{offset:'0','stop-color':`hsl(${h} 100% 80%)`},g);
    el('stop',{offset:'.55','stop-color':`hsl(${h} 95% 58%)`},g);
    el('stop',{offset:'1','stop-color':`hsl(${(h+30)%360} 90% 38%)`},g);
  });
  state.edges.forEach(e=>{
    const a=state.nodes[e.a], b=state.nodes[e.b];
    if(a.status==='hidden'||b.status==='hidden') return;
    if(a.status==='open'&&b.status==='open') return;
    const st=(a.status==='done'&&b.status==='done')?'done':'open';
    const h=hueOf(Math.max(a.tier,b.tier));
    const p=el('path',{d:`M${a.x} ${a.y} L${b.x} ${b.y}`,class:'edge '+st,style:`color:hsl(${h} 100% 65%);stroke:hsl(${h} 100% 65%)`},edgesG);
    if(fresh.includes(e.a)||fresh.includes(e.b)) p.classList.add('appear');
  });
  state.nodes.forEach(n=>{
    if(n.status==='hidden') return;
    const h=hueOf(n.tier), r=34+Math.min(n.tier,8)*2.5, open=n.status==='open';
    const g=el('g',{class:'node'+(fresh.includes(n.id)?' appear':''),transform:`translate(${n.x} ${n.y})`},nodesG);
    nodeEls[n.id]=g;
    const inner=el('g',{class:'bob',style:`animation-delay:${(n.id*0.37)%3}s`},g);
    if(open){ for(let i=0;i<2;i++) el('circle',{r:r+4,fill:'none',stroke:`hsl(${h} 100% 70%)`,'stroke-width':4,class:'pulse',style:`animation-delay:${i*.7}s`},inner); }
    const body=el('g',{class:'body'},inner);
    el('ellipse',{cx:0,cy:r+14,rx:r*.8,ry:8,fill:'#0007'},inner);
    el('circle',{r:r+5,fill:open?'#fff':`hsl(${h} 100% 88%)`},body);
    el('circle',{r:r,fill:open?'#5a3a9e':`url(#g${n.id})`,stroke:'#fff','stroke-width':3},body);
    if(!open) el('ellipse',{cx:-r*.3,cy:-r*.42,rx:r*.34,ry:r*.17,fill:'#fff9',transform:`rotate(-28 ${-r*.3} ${-r*.42})`},body);
    if(open){
      const t=el('text',{y:r*.34,class:'label',fill:'#ffe57a','font-size':44},body); t.textContent='?';
    } else {
      const t=el('text',{y:r*.28,class:'label',fill:'#fff','font-size':36,'stroke-width':4},body); t.textContent=n.mod?n.mod.icon:'';
    }
    const nm=el('text',{y:r+34,class:'label','font-size':18,fill:open?'#d8c8ff':'#fff7e6'},inner); nm.textContent=open?'Uncharted':n.name;
    const sz=sizeForTier(n.tier); const sl=el('text',{y:r+52,class:'label','font-size':13,fill:`hsl(${h} 100% 78%)`},inner);
    sl.textContent=open?`tier ${n.tier}`:`${sz.w} x ${sz.h}  ·  tier ${n.tier}`;
    g.addEventListener('click',ev=>{ ev.stopPropagation(); select(n.id); });
  });
}

/* ---------- interaction ---------- */
function select(id){
  if(flooding) return;
  selected=id; const n=state.nodes[id]; const sz=sizeForTier(n.tier); const open=n.status==='open';
  const p=$('#panel'); p.classList.remove('hide');
  p.innerHTML = `<h2>${open?'Uncharted land':n.name}</h2><div class="sub">${open?'Not yet discovered':'Discovered'}</div>
    <div class="row"><span>Tier</span><span>${n.tier}</span></div>
    <div class="row"><span>Size</span><span>${sz.w} x ${sz.h}</span></div>
    ${open?`<div class="row"><span>Modifier</span><span>you choose</span></div><div class="row"><span>Cost</span><span>1 moon</span></div>
            <button id="bGo">Discover</button>`
          :`<div class="row"><span>Modifier</span><span>${n.mod.icon} ${n.mod.name}</span></div><div class="row"><span>Paths</span><span>${neighbors(id).length}</span></div>
            <button id="bGo">Enter map</button>`}`;
  $('#bGo').onclick=()=> open ? openModal(id) : toast('Entering '+n.name+' ...');
  beep(open?520:380,.08);
}
function openModal(id){
  const n=state.nodes[id]; const pool=[...MODS].sort(()=>rngLive()-.5).slice(0,3);
  $('#modalSub').textContent=`Tier ${n.tier} - the land does not exist yet. Choose how it forms.`;
  const cards=$('#cards'); cards.innerHTML='';
  pool.forEach(m=>{
    const c=document.createElement('div'); c.className='card'; c.style.setProperty('--c',m.c);
    c.innerHTML=`<div class="ic">${m.icon}</div><h3>${m.name}</h3><small>${m.desc}</small><span class="cost">${m.moon<0?m.moon+' moon':'+'+m.moon+' moon'}</span>`;
    c.onclick=()=>{ $('#modal').classList.remove('show'); discover(id,m); };
    cards.appendChild(c);
  });
  $('#modal').classList.add('show'); beep(660,.1); setTimeout(()=>beep(880,.1),90);
}
function discover(id,mod){
  const n=state.nodes[id]; n.status='done'; n.mod=mod; n.seed=Math.floor(rngLive()*1e9);       // created NOW, not before
  const fresh=revealAround(id); fresh.push(id);
  state.moon=Math.max(0,state.moon+mod.moon);
  render(fresh); stats(); tideUI(true); select(id);
  const pos=worldToScreen(n.x,n.y); burst(pos.x,pos.y,hueOf(n.tier),70);
  shakeMap();
  toast(fresh.length>1?`${n.name}  -  ${fresh.length-1} new land${fresh.length>2?'s':''} found!`:n.name);
  [520,660,880,1040].forEach((f,i)=>setTimeout(()=>beep(f,.1),i*80));
  if(state.moon>=MOON_MAX) setTimeout(flood,1200);
}
function shakeMap(){ const m=$('#map'); m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake'); setTimeout(()=>m.classList.remove('shake'),500); }
function toast(t,cls){ const e=$('#toast'); e.textContent=t; e.className=cls||''; void e.offsetWidth; e.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('show'),cls==='dark'?3200:1700); }

const svg=$('#map'); let drag=null;
svg.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false}; svg.setPointerCapture(e.pointerId); svg.classList.add('drag'); });
svg.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.hypot(dx,dy)>3) drag.moved=true; view.x=drag.vx+dx; view.y=drag.vy+dy; applyView(); });
svg.addEventListener('pointerup',()=>{ if(drag&&!drag.moved){ $('#panel').classList.add('hide'); } drag=null; svg.classList.remove('drag'); });
svg.addEventListener('wheel',e=>{ e.preventDefault(); const f=Math.exp(-e.deltaY*0.0012), k=Math.min(2.2,Math.max(.35,view.k*f)); const r=k/view.k;
  view.x=e.clientX-(e.clientX-view.x)*r; view.y=e.clientY-(e.clientY-view.y)*r; view.k=k; applyView(); },{passive:false});

/* ---------- THE TIDE (v3): the sea is at the BOTTOM, the start is high ground at the top ----------
   Warning: storm clouds gather on top, colours drain, a dark sea creeps up from below; lands the water has
   reached turn grey and wet. Flood: a wall of water rolls UP the screen, swallowing every land below it,
   and stops at the start's feet (the high-water mark). Anything above the start is never touched.
   Ebb: the water drains back down, revealing fresh uncharted land. */
const FRONT_TOP=20;                                   // world y where the flood stops: the start's feet
let wave=null, riseNow=0, riseTarget=0, dreadTarget=0, dreadNow=0, lightning=0, surfaceWorld=1e9;
const clouds=Array.from({length:9},(_,i)=>({x:Math.random(),y:Math.random(),s:.4+Math.random()*.7,r:.7+Math.random()*.7}));
function setDread(p){ dreadTarget=p; }
function flood(){
  if(flooding) return; flooding=true;
  const mark=reach(), found=discoveredCount(), gain=Math.max(1,Math.round((mark*3+found)/2));
  $('#panel').classList.add('hide'); $('#modal').classList.remove('show');
  toast('The water is rising...','dark'); rumble(7);
  riseTarget=state.sea0*0.2; setDread(1);
  wave={t0:performance.now()+1800, dur:5400, swapped:false, gain, mark, found, startY:undefined};
  svg.classList.add('tremor');
}
function drawClouds(now){
  const W=innerWidth,H=innerHeight, d=dreadNow;
  const col=a=>'rgba('+Math.round(205-175*d)+','+Math.round(190-150*d)+','+Math.round(245-165*d)+','+a+')';
  clouds.forEach((c,i)=>{
    const x=((c.x*(W+500)+now*0.012*c.s*(1+d*1.5))%(W+500))-250, y=18+c.y*80+d*46, R=(46+c.r*40)*(1+d*.4);
    for(let k=0;k<5;k++){ const ox=(k-2)*R*.72, oy=Math.sin(k*1.7+i)*R*.18, rr=R*(1-Math.abs(k-2)*.16);
      const g=cx.createRadialGradient(x+ox,y+oy,rr*.1,x+ox,y+oy,rr); g.addColorStop(0,col(.5+d*.4)); g.addColorStop(1,col(0));
      cx.fillStyle=g; cx.beginPath(); cx.arc(x+ox,y+oy,rr,0,7); cx.fill(); }
  });
  if(d>0.25){ const g=cx.createLinearGradient(0,0,0,H*.38); g.addColorStop(0,'rgba(6,8,26,'+(d*.6)+')'); g.addColorStop(1,'rgba(6,8,26,0)'); cx.fillStyle=g; cx.fillRect(0,0,W,H*.38); }
  if(lightning>0){ cx.fillStyle='rgba(200,225,255,'+(lightning*.34)+')'; cx.fillRect(0,0,W,H*.6); lightning-=.06; }
}
function drawWater(wy,amp,alpha,foam,now){
  const W=innerWidth,H=innerHeight, sy=worldToScreen(0,wy).y; if(sy>H+60) return null;
  const f=x=>sy+Math.sin(x/90+now/520)*amp+Math.sin(x/37+now/250)*amp*.38+Math.sin(x/230+now/900)*amp*.6;
  const g=cx.createLinearGradient(0,sy-amp,0,sy+Math.max(320,H*.7));
  g.addColorStop(0,'rgba(48,140,178,'+(.62*alpha)+')'); g.addColorStop(.3,'rgba(10,52,92,'+(.84*alpha)+')'); g.addColorStop(1,'rgba(3,16,34,'+(.96*alpha)+')');
  cx.fillStyle=g; cx.beginPath(); cx.moveTo(-30,H+60); for(let x=-30;x<=W+30;x+=14) cx.lineTo(x,f(x)); cx.lineTo(W+30,H+60); cx.closePath(); cx.fill();
  if(foam>0){
    cx.save(); cx.lineJoin='round'; cx.shadowColor='rgba(120,200,230,.8)'; cx.shadowBlur=12+foam*16;
    cx.strokeStyle='rgba(120,190,215,'+(.25*foam)+')'; cx.lineWidth=10+foam*10; cx.beginPath();            // swell riding ahead of the wall
    for(let x=-30;x<=W+30;x+=14) x>-30?cx.lineTo(x,f(x)-28*foam):cx.moveTo(x,f(x)-28*foam); cx.stroke();
    cx.lineWidth=5+foam*19; cx.strokeStyle='rgba(222,238,245,'+(.3+.6*foam)+')'; cx.beginPath();            // ragged white crest
    for(let x=-30;x<=W+30;x+=10) x>-30?cx.lineTo(x,f(x)):cx.moveTo(x,f(x)); cx.stroke();
    cx.lineWidth=3+foam*5; cx.strokeStyle='rgba(110,180,205,.85)'; cx.beginPath();
    for(let x=-30;x<=W+30;x+=10) x>-30?cx.lineTo(x,f(x)+16+foam*8):cx.moveTo(x,f(x)+16+foam*8); cx.stroke();
    cx.restore();
  }
  return f;
}
function drawSeaAndWave(now){
  const W=innerWidth,H=innerHeight;
  riseNow+=(riseTarget-riseNow)*0.025;
  if(!wave){ surfaceWorld=state.sea0-riseNow; drawWater(surfaceWorld,6+riseNow*0.012,1,0.12+riseNow/state.sea0,now); return; }
  const p=(window.__p!==undefined)?window.__p:(now-wave.t0)/wave.dur;
  if(p<0){ surfaceWorld=state.sea0-riseNow; drawWater(surfaceWorld,8+riseNow*0.02,1,0.3+riseNow/state.sea0,now); return; }
  if(wave.startY===undefined) wave.startY=state.sea0-riseNow;
  const pc=Math.min(p,1);
  let frontY, foam, amp;
  if(p<1){
    const e=pc<.5?4*pc*pc*pc:1-Math.pow(-2*pc+2,3)/2;                       // slow start, then crushing
    frontY=wave.startY-e*(wave.startY-FRONT_TOP); foam=1; amp=10+e*16;
    edgesG.style.opacity=String(Math.max(0,1-e*1.3));
  } else {
    if(!wave.swapped){ wave.swapped=true; newWorld(false); edgesG.style.opacity='1'; riseNow=0; riseTarget=0;      // under the water the world is replaced
      pearls+=wave.gain; best=Math.max(best,wave.mark); stats(); showBanner(wave); }
    const pr=(p-1)/0.9, e2=pr<.12?0:1-Math.pow(1-Math.min(1,(pr-.12)/.88),3);   // the ebb: water drains back down
    frontY=FRONT_TOP+e2*(state.sea0-FRONT_TOP); foam=.55*(1-e2)+.12; amp=10-4*e2;
  }
  surfaceWorld=frontY;
  const f=drawWater(frontY,amp,1,foam,now);
  if(p<1 && f){
    for(let i=0;i<9;i++){ const x=Math.random()*W, c=['#6b4a2b','#8a8f99','#3a5a6a','#d8e6ee','#4a3a2a'][Math.floor(Math.random()*5)];
      parts.push({x,y:f(x),vx:(Math.random()-.5)*3,vy:-2-Math.random()*5,g:.17,life:1,d:.010+Math.random()*.012,c,w:4+Math.random()*9,rot:Math.random()*6,vr:(Math.random()-.5)*.3,star:false,bubble:Math.random()<.3}); }
    if(Math.random()<0.014){ lightning=1; thunder(); }
    // lands are swallowed as the wall passes (they sink, darken and leave debris; the start's high ground stays)
    state.nodes.forEach(n=>{ const el_=nodeEls[n.id]; if(!el_||n.id===0||el_.classList.contains('swallowed')) return;
      if(n.y>frontY-25){ el_.classList.add('swallowed'); const s=worldToScreen(n.x,n.y); debris(s.x,s.y,22); thump(); } });
  }
  if(p>=1.95){ wave=null; flooding=false; svg.classList.remove('tremor'); setDread(0); riseNow=0; riseTarget=0; }
}
function updateWet(){   // lands the rising water has already reached turn grey and wet
  state.nodes.forEach(n=>{ const el_=nodeEls[n.id]; if(!el_||el_.classList.contains('swallowed')) return;
    el_.classList.toggle('wet', n.id!==0 && n.y>surfaceWorld+10); });
}
function showBanner(w){
  $('#bTitle').textContent='THE SEA TAKES BACK WHAT IT LENT';
  $('#bSub').textContent='Furthest reach: tier '+w.mark+'   -   '+w.found+' lands lost to the tide';
  $('#bPearls').textContent='Salvaged: '+w.gain+' pearls';
  $('#banner').classList.add('show'); bell(110,3.2); setTimeout(()=>bell(165,3.2),700);
  setTimeout(()=>$('#banner').classList.remove('show'),5200);
}

/* ---------- juice: particles, stars, synth ---------- */
const cv=$('#fx'), cx=cv.getContext('2d'); let parts=[], stars=[];
function size(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  stars=Array.from({length:110},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2+.5,p:Math.random()*6,s:.3+Math.random()})); }
addEventListener('resize',size);
function burst(x,y,h,n){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=2+Math.random()*9;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,g:.22,life:1,d:.012+Math.random()*.018,c:'hsl('+((h+Math.random()*120-30)%360)+' 100% '+(60+Math.random()*20)+'%)',
    w:4+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.4,star:Math.random()<.3}); } }
function debris(x,y,n){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=1.5+Math.random()*5, c=['#6b4a2b','#8a8f99','#3a5a6a','#d8e6ee','#4a3a2a'][Math.floor(Math.random()*5)];
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,g:.2,life:1,d:.010+Math.random()*.012,c,w:4+Math.random()*10,rot:Math.random()*6,vr:(Math.random()-.5)*.3,star:false,bubble:Math.random()<.35}); } }
function loop(t){
  cx.clearRect(0,0,innerWidth,innerHeight);
  dreadNow+=(dreadTarget-dreadNow)*0.02; document.documentElement.style.setProperty('--dread',dreadNow.toFixed(3));
  stars.forEach(s=>{ cx.globalAlpha=(.25+.75*Math.abs(Math.sin(t/1000*s.s+s.p)))*(1-dreadNow*.6); cx.fillStyle='#fff'; cx.beginPath(); cx.arc(s.x,s.y,s.r,0,7); cx.fill(); s.y-=s.s*.08; if(s.y<-5)s.y=innerHeight+5; });
  cx.globalAlpha=1; drawClouds(t); drawSeaAndWave(t); updateWet();
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=.985; p.life-=p.d; p.rot+=p.vr; cx.globalAlpha=Math.max(0,p.life); cx.fillStyle=p.c;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
    if(p.bubble){ cx.strokeStyle='rgba(220,240,250,.8)'; cx.lineWidth=2; cx.beginPath(); cx.arc(0,0,p.w*.6,0,7); cx.stroke(); }
    else if(p.star){ cx.beginPath(); for(let i=0;i<5;i++){ cx.lineTo(Math.cos(i*1.2566-1.57)*p.w,Math.sin(i*1.2566-1.57)*p.w); cx.lineTo(Math.cos(i*1.2566-.94)*p.w*.45,Math.sin(i*1.2566-.94)*p.w*.45);} cx.fill(); }
    else cx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2); cx.restore(); });
  cx.globalAlpha=1; requestAnimationFrame(loop);
}
let ac; function actx(){ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); return ac; }
function beep(f,d){ try{ const a=actx(),o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f;
  g.gain.setValueAtTime(.06,a.currentTime); g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d+.1); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+d+.12);}catch(e){} }
function rumble(sec){ try{ const a=actx(),t=a.currentTime,o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(34,t); o.frequency.linearRampToValueAtTime(52,t+sec*.6);
  f.type='lowpass'; f.frequency.value=150; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.26,t+sec*.6); g.gain.exponentialRampToValueAtTime(.0001,t+sec);
  o.connect(f).connect(g).connect(a.destination); o.start(t); o.stop(t+sec+.1);}catch(e){} }
function thump(){ try{ const a=actx(),t=a.currentTime,o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(40,t+.25);
  g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.connect(g).connect(a.destination); o.start(t); o.stop(t+.32);}catch(e){} }
function thunder(){ try{ const a=actx(),t=a.currentTime,o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(70,t); o.frequency.exponentialRampToValueAtTime(30,t+1.4);
  f.type='lowpass'; f.frequency.value=220; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.3,t+.08); g.gain.exponentialRampToValueAtTime(.0001,t+1.6);
  o.connect(f).connect(g).connect(a.destination); o.start(t); o.stop(t+1.7);}catch(e){} }
function bell(f,d){ try{ const a=actx(),t=a.currentTime,o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.05); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.1);}catch(e){} }

/* ---------- boot ---------- */
function newWorld(fit=true,seed){
  state=generate(seed||Math.floor(Math.random()*1e9)); state.moon=0; riseNow=0; riseTarget=0;
  state.nodes[0].status='done'; state.nodes[0].mod=MODS.find(m=>m.id==='calm'); state.nodes[0].seed=1;
  const fresh=revealAround(0); fresh.push(0);
  selected=null; $('#panel').classList.add('hide'); render(fresh); stats(); tideUI(false); if(fit) fitView();
}
$('#bNew').onclick=()=>{ if(flooding) return; newWorld(true); toast('A new world rises'); beep(700,.1); };
$('#bFlood').onclick=()=>flood();
size(); requestAnimationFrame(loop); newWorld(true,20261116);

/* demo hooks for screenshots: #discover / #progress / #flood */
if(location.hash==='#discover'){ setTimeout(()=>{ const o=state.nodes.find(n=>n.status==='open'); select(o.id); openModal(o.id); },300); }
if(location.hash==='#progress'){ setTimeout(()=>{ for(let i=0;i<6;i++){ const o=state.nodes.filter(n=>n.status==='open'); if(!o.length) break; const n=o[Math.floor(o.length/2)]; discover(n.id,MODS[i%MODS.length]); } state.moon=8; tideUI(false); $('#panel').classList.add('hide'); },300); }
if(location.hash==='#flood'){ setTimeout(()=>{ for(let i=0;i<7;i++){ const o=state.nodes.filter(n=>n.status==='open'); const n=o[Math.floor(o.length/2)]; discover(n.id,MODS[i%MODS.length]); } state.moon=3; flood(); },300); }
if(location.hash==='#floodmid'||location.hash==='#floodlate'){ setTimeout(()=>{ for(let i=0;i<7;i++){ const o=state.nodes.filter(n=>n.status==='open'); const n=o[Math.floor(o.length/2)]; discover(n.id,MODS[i%MODS.length]); } state.moon=3; flood(); window.__p=location.hash==="#floodmid"?0.62:1.12; },300); }
</script>
